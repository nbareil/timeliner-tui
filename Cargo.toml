[package]
name = "timeliner-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "timeliner-tui"
description = "An indexed terminal workbench for forensic bodyfile timelines"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.21"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"

[profile.dev]
# Keep large timeline scans responsive in cargo run / target/debug builds.
# Debug information, assertions, and overflow checks retain their defaults.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "timeliner-bench"
path = "src/bin/bench.rs"
